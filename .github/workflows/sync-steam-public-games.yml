name: Sync public Steam games

on:
  workflow_dispatch:
  schedule:
    - cron: "23 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-steam-public-games
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch games visible to public visitors
        env:
          STEAM_ID: "76561199152950377"
        run: node .github/scripts/update-steam-public-games.mjs
      - name: Commit changed snapshot
        run: |
          if git diff --quiet -- data/steam-public-games.json; then
            echo "Steam visibility has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/steam-public-games.json
          git commit -m "chore: sync public Steam games"
          git push
